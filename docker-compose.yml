services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MODE: dev
      PORT: '8000'
      AGENT_BUNDLE_PATH: /agent/dist/agent.js
      MONGO_URI: mongodb://mongo:27017/zydock
      JWT_SECRET: dev-secret-change-me
      ENCRYPTION_KEY: 8874c9eba1f0ffabac2e7cf6b945c0a6746207f2bc618e01d5faaa4c2c95b905
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      URL_API: http://backend:8000
      NUXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
      PORT: '3000'
      HOST: 0.0.0.0
    ports:
      - '3000:3000'

volumes:
  mongo-data:
