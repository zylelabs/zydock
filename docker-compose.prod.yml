services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      MODE: prod
      PORT: '8000'
      AGENT_BUNDLE_PATH: /agent/dist/agent.js
    volumes:
      - backend-storage:/app/storage
    # With a domain, Caddy reaches the service over the Compose network and the published port only
    # needs to answer on the host itself (BIND_HOST=127.0.0.1); without one, it is the dashboard.
    ports:
      - '${BIND_HOST:-0.0.0.0}:8000:8000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/api/health']
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/zydock/builds:/var/lib/zydock/builds
      - caddy-admin:/var/run/caddy
    environment:
      MODE: prod
      AGENT_TOKEN: ${LOCAL_AGENT_TOKEN}
      BACKEND_URL: http://backend:8000
      WORKSPACE_PATH: /var/lib/zydock/builds
      CADDY_ADMIN_URL: unix:/var/run/caddy/admin.sock
      PROXY_HTTPS_HOST: caddy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: '3000'
      HOST: 0.0.0.0
      URL_API: http://backend:8000
    ports:
      - '${BIND_HOST:-0.0.0.0}:3000:3000'

  # The reverse proxy of this server: it serves the domains of the deployed applications and, when
  # ZYDOCK_DOMAIN is set, the dashboard itself. Both are routes pushed by the agent over the admin
  # API, so it also runs without a domain — `--resume` keeps those routes across restarts.
  caddy:
    image: caddy:2
    restart: unless-stopped
    # A socket left behind by an unclean stop would keep the admin API from binding again.
    command: sh -c 'rm -f /var/run/caddy/admin.sock && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume'
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/var/run/caddy
    networks:
      # `default` reaches the dashboard, `zydock` the containers deployed on this server.
      - default
      - zydock

volumes:
  mongo-data:
  backend-storage:
  caddy-data:
  caddy-config:
  caddy-admin:

networks:
  # Created by scripts/install.sh (and by the SSH provisioning on remote servers), never owned by
  # Compose: the deployed applications join it too.
  zydock:
    external: true
