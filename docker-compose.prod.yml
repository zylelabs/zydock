services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      MODE: prod
      PORT: '8000'
      AGENT_BUNDLE_PATH: /agent/dist/agent.js
    volumes:
      - backend-storage:/app/storage
    # With a domain, Caddy reaches the service over the Compose network and the published port only
    # needs to answer on the host itself (BIND_HOST=127.0.0.1); without one, it is the dashboard.
    ports:
      - '${BIND_HOST:-0.0.0.0}:8000:8000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/api/health']
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/zydock/builds:/var/lib/zydock/builds
    environment:
      MODE: prod
      AGENT_TOKEN: ${LOCAL_AGENT_TOKEN}
      BACKEND_URL: http://backend:8000
      WORKSPACE_PATH: /var/lib/zydock/builds

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: '3000'
      HOST: 0.0.0.0
      URL_API: http://backend:8000
    ports:
      - '${BIND_HOST:-0.0.0.0}:3000:3000'

  # Only started when ZYDOCK_DOMAIN is set (`docker compose --profile domain ...`); gives the
  # dashboard a single HTTPS domain instead of the raw frontend/backend ports.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ['domain']
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ZYDOCK_DOMAIN: ${ZYDOCK_DOMAIN}

volumes:
  mongo-data:
  backend-storage:
  caddy-data:
  caddy-config:
