name: Images

on:
  push:
    tags: ["v*"]
    branches: [nightly]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build images for (e.g. v0.2.0)."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build images for (e.g. v0.2.0)."
        required: true
        type: string

concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: zylelabs

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: agent
            context: ./agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve image tags
        id: tags
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/zydock-${{ matrix.service }}"

          case "${REF}" in
          v[0-9]*)
            TAGS="${IMAGE}:${REF#v}"
            case "${REF}" in
            *-*) ;;
            *) TAGS="${TAGS},${IMAGE}:latest" ;;
            esac
            ;;
          *) TAGS="${IMAGE}:nightly" ;;
          esac

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
