name: Images

on:
  push:
    tags: ["v*"]
    branches: [nightly]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build images for (e.g. v0.2.0)."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build images for (e.g. v0.2.0)."
        required: true
        type: string

concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: zylelabs

jobs:
  meta:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Resolve image versions
        id: versions
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          case "${REF}" in
          v[0-9]*)
            VERSIONS="${REF#v}"
            case "${REF}" in
            *-*) ;;
            *) VERSIONS="${VERSIONS} latest" ;;
            esac
            ;;
          *) VERSIONS="nightly" ;;
          esac

          echo "Publishing: ${VERSIONS}"
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, agent]
        platform: [amd64, arm64]
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: agent
            context: ./agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/zydock-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.service }} manifest
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, agent]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          VERSIONS: ${{ needs.meta.outputs.versions }}
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/zydock-${{ matrix.service }}"

          TAG_ARGS=""
          for VERSION in ${VERSIONS}; do
            TAG_ARGS="${TAG_ARGS} --tag ${IMAGE}:${VERSION}"
          done

          SOURCES=""
          for DIGEST in /tmp/digests/*; do
            SOURCES="${SOURCES} ${IMAGE}@sha256:$(basename "${DIGEST}")"
          done

          docker buildx imagetools create ${TAG_ARGS} ${SOURCES}
