name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)."
        required: true
        type: string
    outputs:
      url:
        description: "URL of the draft release, empty when nothing was drafted."
        value: ${{ jobs.release.outputs.url }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.draft.outputs.url }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CALLED: ${{ github.event_name == 'workflow_call' }}
    steps:
      - name: Validate tag format
        run: |
          case "${TAG}" in
          v[0-9]*) ;;
          *)
            echo "::error::Refusing to publish '${TAG}': tag must match v*."
            exit 1
            ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify tag is publishable
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist."
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${CALLED}" = "true" ]; then
              echo "::warning::A release for ${TAG} already exists; nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::A release for ${TAG} already exists."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve previous tag
        id: previous
        if: steps.verify.outputs.skip != 'true'
        run: |
          case "${TAG}" in
          *-*) CANDIDATES="$(git tag --sort=-v:refname)" ;;
          *) CANDIDATES="$(git tag --sort=-v:refname | { grep -Ev -- '-' || true; })" ;;
          esac

          PREVIOUS="$(printf '%s\n' "${CANDIDATES}" | { grep -Fxv "${TAG}" || true; } | head -n1)"
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Comparing ${TAG} against ${PREVIOUS:-the start of history}."

      - name: Draft release
        id: draft
        if: steps.verify.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          scripts/release-notes.sh "${TAG}" "${PREVIOUS_TAG}" > /tmp/release-notes.md

          PRERELEASE_ARGS=()
          case "${TAG}" in
          *-*) PRERELEASE_ARGS=(--prerelease) ;;
          esac

          URL="$(gh release create "${TAG}" --draft --title "${TAG}" \
            --notes-file /tmp/release-notes.md "${PRERELEASE_ARGS[@]}")"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: steps.draft.outputs.url != ''
        env:
          URL: ${{ steps.draft.outputs.url }}
        run: |
          {
            echo "## Draft release ${TAG}"
            echo
            echo "Review the notes and press **Publish release** — the tag is pushed, but nothing"
            echo "is announced until then."
            echo
            echo "- Draft: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
