name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)."
        required: true
        type: string

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify tag is publishable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist."
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists."
            exit 1
          fi

      - name: Resolve previous tag
        id: previous
        run: |
          case "${TAG}" in
          *-*) CANDIDATES="$(git tag --sort=-v:refname)" ;;
          *) CANDIDATES="$(git tag --sort=-v:refname | { grep -Ev -- '-' || true; })" ;;
          esac

          PREVIOUS="$(printf '%s\n' "${CANDIDATES}" | { grep -Fxv "${TAG}" || true; } | head -n1)"
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Comparing ${TAG} against ${PREVIOUS:-the start of history}."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          if [ -n "${PREVIOUS_TAG}" ]; then
            NOTES="$(git log --oneline --no-decorate "${PREVIOUS_TAG}..${TAG}")"
          else
            NOTES="$(git log --oneline --no-decorate "${TAG}")"
          fi

          PRERELEASE_ARGS=()
          case "${TAG}" in
          *-*) PRERELEASE_ARGS=(--prerelease) ;;
          esac

          gh release create "${TAG}" --title "${TAG}" --notes "${NOTES}" "${PRERELEASE_ARGS[@]}"
