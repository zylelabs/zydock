name: Catalog Health

on:
  pull_request:
    branches-ignore: [nightly, main]
    paths:
      - "templates/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  validate:
    name: Validate template catalog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Validate catalog (schema, denylist, compose config, images, links)
        id: validate
        continue-on-error: true
        run: bun run validate:catalog --report-json /tmp/catalog-report.json

      - name: Open or update issues for scheduled failures
        if: steps.validate.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s /tmp/catalog-report.json ]; then
            title="Catalog check crashed before producing a report"
            body="The scheduled catalog validation crashed before it could report per-template failures. See the run: ${RUN_URL}"
            existing="$(gh issue list --search "in:title \"${title}\"" --state open --json number --jq '.[0].number')"
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "${body}"
            else
              gh issue create --title "${title}" --body "${body}"
            fi
            exit 0
          fi

          jq -c '.failures[]' /tmp/catalog-report.json | while read -r failure; do
            templateId="$(echo "${failure}" | jq -r '.templateId')"
            check="$(echo "${failure}" | jq -r '.check')"
            message="$(echo "${failure}" | jq -r '.message')"
            title="Catalog check failed: ${templateId} (${check})"
            body="$(printf 'Scheduled catalog validation found a problem.\n\n**Template:** %s\n**Check:** %s\n**Reason:** %s\n\nWorkflow run: %s\n' "${templateId}" "${check}" "${message}" "${RUN_URL}")"

            existing="$(gh issue list --search "in:title \"${title}\"" --state open --json number --jq '.[0].number')"
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "${body}"
            else
              gh issue create --title "${title}" --body "${body}"
            fi
          done

      - name: Fail the job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
