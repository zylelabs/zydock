name: Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create (e.g. v0.2.0). Empty = root package.json version."
        required: false
        type: string

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag stable release
    runs-on: ubuntu-latest
    permissions:
      actions: read # gh run list
      contents: write
    steps:
      - name: Guard branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Release tags are cut from main only (ran on '${GITHUB_REF_NAME}')."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check main CI status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(gh run list --branch main --workflow ci.yml --limit 1 --json conclusion --jq '.[0].conclusion')"
          if [ "${STATUS}" != "success" ]; then
            echo "::error::main CI is not green (${STATUS:-no run found})."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="v$(scripts/version.sh root-version)"
          fi

          case "${VERSION}" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *)
            echo "::error::'${VERSION}' is not a stable version in vX.Y.Z form."
            exit 1
            ;;
          esac
          case "${VERSION}" in
          *-*)
            echo "::error::'${VERSION}' is a prerelease — stable tags carry no suffix."
            exit 1
            ;;
          esac

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists — bump the root package.json version."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"
