name: CI

on:
  push:
    branches: [main, nightly, dev]
  pull_request:
    branches: [dev, nightly, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.package }} (lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            needs-mongo: true
          - package: frontend
            needs-mongo: false
          - package: agent
            needs-mongo: false
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Start Mongo
        if: matrix.needs-mongo
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Mongo never answered a ping after 60s" >&2
          docker logs mongo >&2
          exit 1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  docker-build:
    name: build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: agent
            context: ./agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [backend/Dockerfile, frontend/Dockerfile, agent/Dockerfile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --failure-threshold error - < ${{ matrix.dockerfile }}

  shellcheck:
    name: shellcheck (scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: >
          docker run --rm -v "$PWD/scripts:/scripts"
          koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          --severity=warning
          /scripts/install.sh /scripts/uninstall.sh /scripts/update-runner.sh /scripts/update.sh /scripts/version.sh

  smoke-test:
    name: smoke test (docker-compose.prod.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate test secrets
        run: |
          MONGO_PASSWORD="$(openssl rand -hex 24)"

          cat >.env <<EOF
          MODE=prod
          MONGO_USERNAME=zydock
          MONGO_PASSWORD=${MONGO_PASSWORD}
          MONGO_URI=mongodb://zydock:${MONGO_PASSWORD}@mongo:27017/zydock?authSource=admin
          JWT_SECRET=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          LOCAL_AGENT_TOKEN=$(openssl rand -hex 32)
          EOF
      - name: Start the stack
        run: |
          docker network inspect zydock >/dev/null 2>&1 || docker network create zydock
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend wget -qO- http://localhost:8000/api/health && exit 0
            sleep 5
          done
          echo "backend never became healthy" >&2
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env down -v
