version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    groups:
      patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: monthly
    groups:
      patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      patches:
        update-types: [patch]
